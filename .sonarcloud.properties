sonar.sources=.
# apps/hwp-studio의 index.html·static/print.html·static/print.css는 상류 rhwp-studio 마크업·스타일을 그대로 유지하는 포크(config/rhwp-studio-overrides.json)이므로
# 상류와 다르게 고치지 않도록 분석에서 제외한다.
# deflate/reference_inflate.rs는 이식 전 해제 구현을 동등성 기준으로 그대로 보존한 테스트 전용 사본이라 분석에서 제외한다.
sonar.exclusions=third_party/**,vendor/**,crates/easyoffice-app/ui/hwp-studio/**,**/node_modules/**,assets/fonts/**,crates/easyoffice-formats/assets/**,crates/easyoffice-formats/tests/fixtures/**,crates/easyoffice-formats/src/deflate/reference_inflate.rs,apps/hwp-studio/index.html,apps/hwp-studio/static/print.html,apps/hwp-studio/static/print.css
# 자체 점검의 WebUI 자산 표(WEBUI_ASSET_MARKERS)는 같은 형태의 항목이 반복되는 선언 데이터라 중복 탐지에서만 제외한다.
sonar.cpd.exclusions=crates/easyoffice-app/src/self_test.rs
