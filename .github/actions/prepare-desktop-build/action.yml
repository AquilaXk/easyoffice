name: Prepare desktop release build
description: >-
  Gates and inputs every release build runs before bundling: repository hygiene, the bundle contract and
  WebUI suites, the pinned rhwp checkout and editor bundle (generated, not tracked, PD-081 and PD-083),
  then the Rust workspace tests and the engine self-test. Needs a checkout; Linux also needs the
  install-linux-deps action first.

inputs:
  rust-targets:
    description: Space-separated extra Rust compilation targets (the macOS universal build needs two).
    required: false
    default: ""

runs:
  using: composite
  steps:
    # One pinned version for every Rust build (PD-147).
    - name: Set up the pinned Rust toolchain
      uses: ./.github/actions/setup-rust
      with:
        targets: ${{ inputs.rust-targets }}

    - name: Setup Node.js for the hygiene guard, the editor bundle and the Tauri CLI
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: "22"

    # The CLI the signing step runs comes from the committed lockfile: every package is checked against its
    # integrity hash and no install script runs, so a changed registry package cannot reach the signing key.
    - name: Install the pinned Tauri CLI from the lockfile
      shell: bash
      run: npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/tauri-cli

    # The bundler's downloaded tools (PD-118); the build step retries a failed download.
    - name: Cache the Tauri bundler tools
      uses: ./.github/actions/cache-tauri-tools
      with:
        tauri-cli-version: 2.12.4

    - name: Run repository hygiene guard
      shell: bash
      run: node scripts/check-repo-hygiene.mjs

    - name: Run desktop bundle contract, release asset and WebUI regression suites
      shell: bash
      run: node --test scripts/test-desktop-file-associations.mjs scripts/test-release-assets.mjs scripts/test-verify-linux-bundles.mjs scripts/test-retry-on-download-failure.mjs "scripts/test-webui-*.mjs"

    # The desktop shell embeds the editor bundle and fails to build without it, so it is built before
    # any Rust step.
    - name: Check out the pinned rhwp upstream and build the hwp-studio editor bundle
      shell: bash
      run: |
        node scripts/checkout-rhwp.mjs
        node scripts/build-hwp-studio.mjs

    - name: Run Rust workspace test suite and self-test
      shell: bash
      run: |
        cargo test --workspace --locked
        cargo run --locked -p easyoffice-app -- --self-test
