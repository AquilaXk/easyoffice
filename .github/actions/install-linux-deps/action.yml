name: Install Linux build dependencies
description: >-
  System packages the Tauri desktop shell needs on Ubuntu 22.04: WebKitGTK 4.1, GTK 3, the menu library
  (libxdo), the packaging tools for deb, rpm and AppImage, and FUSE for the AppImage tooling.

# Reference implementation (MIT, Copyright (c) 2025-2026 Edward Kim) of the reference app's desktop
# release workflow (.github/workflows/*-desktop.yml, "Install Linux dependencies"): the same package
# list, moved into one action that the CI job and the release job share.

runs:
  using: composite
  steps:
    - name: Install WebKitGTK, GTK and the packaging tools
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          curl \
          file \
          libayatana-appindicator3-dev \
          libfuse2 \
          libgtk-3-dev \
          librsvg2-dev \
          libssl-dev \
          libwebkit2gtk-4.1-dev \
          libxdo-dev \
          patchelf \
          pkg-config \
          rpm \
          wget
