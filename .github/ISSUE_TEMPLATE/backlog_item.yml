name: "백로그 항목 (Backlog Sub-issue)"
description: "에픽 하위의 완결된 기능·개선 백로그 항목을 등록합니다 (1개 또는 소수의 자기완결 PR로 완료)."
title: "[Feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        - 이 이슈는 상위 영역 Epic의 **GitHub sub-issue**로 연결되는 완결된 백로그 항목 1개입니다.
        - 오탈자·단순 설정·린트·목록 추가 등 경미한 작업(Class C)은 새 이슈를 만들지 않고 PR로 직행합니다.
        - 외부 상용 서비스명을 언급하지 않고 표준 규격(`OOXML`, `ODF`, `HWP 5.0/HWPX`, `PDF ISO 32000`)과 도메인 용어로만 기술합니다.
  - type: input
    id: parent_epic
    attributes:
      label: 상위 에픽 및 대상 모듈 (Parent Epic & Module)
      placeholder: "예) Parent: #2 | Module: EasyOfficeCore / SheetEngine"
    validations:
      required: true
  - type: textarea
    id: goal_and_background
    attributes:
      label: 목표 및 배경 (Goal & Background)
      description: 해결하려는 문제와 구현 완료 후 사용자/시스템이 얻는 결과를 적습니다.
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: 작업 체크리스트 및 완료 조건 (Checklist & Done When)
      placeholder: |
        - [ ] 핵심 도메인 로직 및 UI 연동 구현
        - [ ] 결정론적 단위/통합 테스트 추가 및 통과 (`swift test`)
        - [ ] 정책 변경 시 `docs/policy-decisions.md` 동기화
    validations:
      required: true
  - type: textarea
    id: verification_and_evidence
    attributes:
      label: 검증 계획 및 PR 첨부 증거 계획 (Verification & Evidence Plan)
      placeholder: |
        - 검증 명령: `node scripts/check-repo-hygiene.mjs && swift build && swift test`
        - PR 증거: 테스트 출력 로그 및 UI 변경 시 화면 캡처 첨부
    validations:
      required: true
