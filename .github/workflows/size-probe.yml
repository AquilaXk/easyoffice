name: Executable size probe

# Manual only (PD-397): how much of the desktop executable the symbol strip of the release profile
# (`strip = "symbols"`, PD-293) takes off on Linux and Windows, which the macOS numbers of
# docs/performance.md 8.4 do not say. Each job builds the desktop shell twice, as shipped and with
# `CARGO_PROFILE_RELEASE_STRIP=none`, and writes both sizes to the job summary. Nothing is uploaded and no
# installer is made, so the regular CI and the release do not depend on it.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  probe-linux:
    name: Strip width (Linux x64)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install the Linux build dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Setup Node.js for the hwp-studio bundle build
        uses: ./.github/actions/setup-node-ci
        with:
          node-version: "22"
          cache: "true"

      - name: Set up the pinned Rust toolchain (PD-147)
        uses: ./.github/actions/setup-rust

      - name: Check out the pinned rhwp upstream (sparse, shallow)
        run: node scripts/checkout-rhwp.mjs

      - name: Build the hwp-studio editor bundle (npm ci --ignore-scripts, vite build, static checks)
        run: node scripts/build-hwp-studio.mjs

      - name: Build the desktop shell as shipped and without the symbol strip, and write both sizes
        shell: bash
        run: |
          cargo build --release --locked -p easyoffice-desktop
          CARGO_PROFILE_RELEASE_STRIP=none cargo build --release --locked -p easyoffice-desktop --target-dir target-unstripped
          SHIPPED=$(stat -c%s target/release/EasyOffice)
          UNSTRIPPED=$(stat -c%s target-unstripped/release/EasyOffice)
          {
            echo "### Executable size, Linux x64"
            echo ""
            echo "| build | bytes |"
            echo "|---|---|"
            echo "| as shipped (\`strip = \"symbols\"\`) | ${SHIPPED} |"
            echo "| \`strip = \"none\"\` | ${UNSTRIPPED} |"
            echo "| taken off by the strip | $((UNSTRIPPED - SHIPPED)) ($(( (UNSTRIPPED - SHIPPED) * 1000 / UNSTRIPPED ))‰ of the unstripped size) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  probe-windows:
    name: Strip width (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js for the hwp-studio bundle build
        uses: ./.github/actions/setup-node-ci
        with:
          node-version: "22"
          cache: "true"

      - name: Set up the pinned Rust toolchain (PD-147)
        uses: ./.github/actions/setup-rust

      - name: Check out the pinned rhwp upstream (sparse, shallow)
        run: node scripts/checkout-rhwp.mjs

      - name: Build the hwp-studio editor bundle (npm ci --ignore-scripts, vite build, static checks)
        run: node scripts/build-hwp-studio.mjs

      - name: Build the desktop shell as shipped and without the symbol strip, and write both sizes
        shell: bash
        run: |
          cargo build --release --locked -p easyoffice-desktop
          CARGO_PROFILE_RELEASE_STRIP=none cargo build --release --locked -p easyoffice-desktop --target-dir target-unstripped
          SHIPPED=$(stat -c%s target/release/EasyOffice.exe)
          UNSTRIPPED=$(stat -c%s target-unstripped/release/EasyOffice.exe)
          {
            echo "### Executable size, Windows x64"
            echo ""
            echo "| build | bytes |"
            echo "|---|---|"
            echo "| as shipped (\`strip = \"symbols\"\`) | ${SHIPPED} |"
            echo "| \`strip = \"none\"\` | ${UNSTRIPPED} |"
            echo "| taken off by the strip | $((UNSTRIPPED - SHIPPED)) ($(( (UNSTRIPPED - SHIPPED) * 1000 / UNSTRIPPED ))‰ of the unstripped size) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
