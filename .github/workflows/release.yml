name: Release Packages

# Reference implementation (MIT, Copyright (c) 2025-2026 Edward Kim) of the reference app's desktop
# release workflow (.github/workflows/*-desktop.yml): the Linux build matrix (x64 AppImage, deb and rpm;
# arm64 deb), the AppImage extraction check, fixed release asset names, one combined checksum file and
# the draft release, and its signed updater artifacts (createUpdaterArtifacts, a `.sig` per package, the
# `latest.json` manifest, the required signing key). The staging, the manifest and the checks are scripts
# here (scripts/release-assets.mjs, scripts/verify-linux-bundles.mjs) with unit tests; the shared build
# steps are composite actions (.github/actions). The macOS notarization of the reference is not taken
# over (PD-094); the update signature is the Tauri minisign key (PD-103).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true
        default: "0.1.0"
      publish:
        description: "Publish the GitHub Release (false builds and uploads Actions artifacts only)"
        type: boolean
        required: false
        default: true
      release_draft:
        description: "Create the release as a draft (QA publishes it after checking). A tag push always creates a draft."
        type: boolean
        required: false
        default: true

# Tag pushes group by tag. A manual run groups by version, publish flag and draft flag, so a trial
# build (publish=false) never queues behind or replaces a publishing run of the same version, and a
# queued request to publish a release is never cancelled by a draft request for the same version.
# Publishing has a group of its own, by version (the `publish-release` job): a tag push and a manual run
# of the same version build side by side but never write the release at the same time.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}-{1}-{2}', inputs.version, inputs.publish, inputs.release_draft) || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Resolves the version, tag and draft state once for every job. A tag push must name the version the
  # sources carry, or the app would ship with a stale version (PD-103 compares it with the latest
  # release); it runs first so a mismatch fails before any build.
  prepare:
    name: Resolve Release and Check Tag Matches Cargo Workspace Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      draft: ${{ steps.meta.outputs.draft }}
      skip: ${{ steps.published.outputs.skip }}
    steps:
      # First step, before anything uses the value: the version ends up in a tag, a JSON build
      # override and a release title, so only a plain semantic version passes. A release that is
      # public at once (release_draft=false) may only come from main.
      - name: Resolve and validate the release version, tag and draft state
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_DRAFT: ${{ inputs.release_draft }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Every run signs its updater packages, a trial run (publish=false) included: a trial that skipped
          # the signing would not test the step that is most likely to fail. Without the key the build
          # cannot make the signatures the app requires, so stop before building anything.
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required: the updater packages must be signed (PD-103)"
            exit 1
          fi
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required: the signing key is password protected (PD-103)"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The release version must look like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          # Only an explicit release_draft=false on a manual run publishes right away.
          DRAFT=true
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$INPUT_DRAFT" = false ]; then
            DRAFT=false
          fi
          if [ "$DRAFT" = false ] && [ "$INPUT_PUBLISH" = true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::A release that is public at once (release_draft=false) may only be created from main"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "draft=$DRAFT"
          } >> "$GITHUB_OUTPUT"

      # A published release is final (PD-283): its packages, signatures and latest.json are what installed
      # apps verify and update from, so nothing rebuilds or replaces them. QA publishing a draft creates the
      # tag, and that tag push starts this workflow again on the commit the draft was built from; without
      # this step it would build for over an hour and then upload over the public assets. `/releases/tags`
      # lists published releases only: a draft or a missing release answers 404 and the run goes on as before.
      # A tag push with a public release stops here (every later job is skipped); a manual run that would
      # publish a public version fails at once instead of building first (publish=false builds stay allowed).
      - name: Stop when this version's release is already public
        id: published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -uo pipefail
          ERR_FILE="$RUNNER_TEMP/release-lookup.err"
          PUBLISHED=false
          if DRAFT_FLAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .draft 2>"$ERR_FILE"); then
            if [ "$DRAFT_FLAG" = false ]; then
              PUBLISHED=true
            fi
          elif ! grep -q 'HTTP 404' "$ERR_FILE"; then
            cat "$ERR_FILE" >&2
            echo "::error::Could not read the release of $TAG"
            exit 1
          fi
          SKIP=false
          if [ "$PUBLISHED" = true ]; then
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$INPUT_PUBLISH" = true ]; then
              echo "::error::$TAG is already published; its assets are never replaced. Release a new version, or run with publish=false for a trial build"
              exit 1
            fi
            if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
              echo "::notice::$TAG is already published; nothing is rebuilt or uploaded"
              SKIP=true
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Verify checked-out commit matches trigger SHA
        uses: ./.github/actions/assert-sha
        with:
          expected-sha: ${{ github.sha }}

      - name: Compare the tag version with the workspace package version
        if: github.ref_type == 'tag'
        env:
          TAG_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          CARGO_VERSION="$(awk '/^\[workspace\.package\]/{in_pkg=1; next} /^\[/{in_pkg=0} in_pkg && /^version[[:space:]]*=/{gsub(/.*=[[:space:]]*"|".*/, ""); print; exit}' Cargo.toml)"
          test -n "$CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match Cargo workspace version $CARGO_VERSION"
            exit 1
          fi

  # One job per macOS architecture (PD-297), so a user downloads one .dmg of about half the size of the
  # former universal one. Each architecture builds on a runner of its own: the Intel build runs on
  # `macos-15-intel`, so the smoke test starts the binary that was built. GitHub runs Intel macOS runners
  # until the macOS 15 image is retired in fall 2027; then the x64 entry moves to `macos-15` (the build
  # already names its target and its Quick Look architecture, only the smoke test needs Rosetta there).
  release-macos:
    name: Build ${{ matrix.platform }} Release Artifacts
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.runner }}
    # Each job compiles one target with thin LTO and one codegen unit (PD-276), half of the two-target
    # build that took 50 min before LTO.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            archs: arm64
            rust-tests: "true"
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            archs: x86_64
            # The Rust suite runs on the same commit in macos-arm64, linux-x64 and Windows (PD-301); this
            # job keeps the hygiene, node suites, editor bundle and the engine self-test.
            rust-tests: "false"
    env:
      PLATFORM: ${{ matrix.platform }}
      TARGET: ${{ matrix.target }}
      ARCHS: ${{ matrix.archs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out commit matches trigger SHA
        uses: ./.github/actions/assert-sha
        with:
          expected-sha: ${{ github.sha }}

      - name: Run the shared release gates and prepare the editor bundle
        uses: ./.github/actions/prepare-desktop-build
        with:
          rust-targets: ${{ matrix.target }}
          rust-tests: ${{ matrix.rust-tests }}
          cache-key: ${{ matrix.platform }}-release
          cache-workspaces: |
            . -> target
            apps/quicklook/rust -> target

      # The Quick Look preview and thumbnail extensions (PD-140) are copied into the app's PlugIns
      # folder by bundle.macOS.files, so they are built first, for this architecture only, with the same
      # signing identity as the app and the release version.
      - name: Build the Quick Look preview and thumbnail extensions (this architecture)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          EASYOFFICE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/build-quicklook-macos.mjs --arch "$ARCHS"

      # .dmg without a Developer ID (PD-094). The identity "-" is an ad-hoc signature (Apple
      # silicon refuses to run a binary without any signature; Gatekeeper still prompts on first open).
      # To sign and notarize later, add the APPLE_SIGNING_IDENTITY secret and pass APPLE_ID,
      # APPLE_PASSWORD and APPLE_TEAM_ID to this step; the Tauri CLI reads them from the environment.
      # The release version overrides the bundle version so the Info.plist and the tag agree.
      # createUpdaterArtifacts adds the signed .app.tar.gz the app's updater installs (the signing key
      # comes from the secrets, only here; local and CI builds have no key and do not switch it on).
      - name: Build EasyOffice desktop shell .dmg and the signed updater archive
        working-directory: crates/easyoffice-desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          BUNDLES="$(node "$GITHUB_WORKSPACE/scripts/release-assets.mjs" bundles "$PLATFORM")"
          node "$GITHUB_WORKSPACE/scripts/retry-on-download-failure.mjs" -- node "$GITHUB_WORKSPACE/scripts/tauri-cli/node_modules/@tauri-apps/cli/tauri.js" build --ci --target "$TARGET" --bundles "$BUNDLES" --config "{\"version\":\"${VERSION}\",\"bundle\":{\"createUpdaterArtifacts\":true}}" -- --locked

      - name: Verify the app holds only this job's architecture
        run: |
          FOUND="$(lipo -archs "target/$TARGET/release/bundle/macos/EasyOffice.app/Contents/MacOS/EasyOffice")"
          if [ "$FOUND" != "$ARCHS" ]; then
            echo "::error::EasyOffice is built for [$FOUND], expected [$ARCHS]"
            exit 1
          fi

      - name: Verify the Quick Look extensions are inside the app (identity, types, sandbox, architecture)
        run: node scripts/verify-quicklook-bundle.mjs "target/$TARGET/release/bundle/macos/EasyOffice.app" --archs "$ARCHS"

      - name: Smoke test desktop shell window (embedded WebUI, IPC round trip and HWP editor round trip)
        if: vars.MACOS_SMOKE != 'off'
        run: |
          set -u
          "target/$TARGET/release/bundle/macos/EasyOffice.app/Contents/MacOS/EasyOffice" --smoke &
          PID=$!
          for _ in $(seq 1 90); do
            kill -0 "$PID" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$PID" 2>/dev/null; then
            kill -9 "$PID" || true
            echo "Desktop shell smoke test timed out"
            exit 1
          fi
          wait "$PID" && CODE=0 || CODE=$?
          if [ "$CODE" -ne 0 ]; then
            echo "Desktop shell smoke test failed with exit code $CODE"
            exit 1
          fi

      - name: Verify the third-party notices and the PDF export font are inside the app
        run: |
          RES="target/$TARGET/release/bundle/macos/EasyOffice.app/Contents/Resources"
          test -f "$RES/THIRD_PARTY_NOTICES.md"
          test -f "$RES/pdf-fonts/NotoSansKR-Regular.ttf"
          test -f "$RES/pdf-fonts/NotoSansKR-OFL.txt"

      - name: Stage the macOS .dmg and the signed updater archive under their fixed names
        run: node scripts/release-assets.mjs stage "$PLATFORM" dist

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  build-windows-release:
    name: Build Windows x64 Installer & Release Artifacts
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out commit matches trigger SHA
        uses: ./.github/actions/assert-sha
        with:
          expected-sha: ${{ github.sha }}

      - name: Run the shared release gates and prepare the editor bundle
        uses: ./.github/actions/prepare-desktop-build
        with:
          cache-key: windows-x64-release

      # Prebuilt Tauri CLI (major 2) installed from scripts/tauri-cli/package-lock.json; it builds crates/easyoffice-desktop in release mode
      # with the WebUI embedded and packages it with NSIS. The release version overrides the
      # installer version so the installer metadata and the tag agree.
      - name: Build EasyOffice desktop shell and the signed NSIS installer
        working-directory: crates/easyoffice-desktop
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          BUNDLES="$(node "$GITHUB_WORKSPACE/scripts/release-assets.mjs" bundles windows-x64)"
          node "$GITHUB_WORKSPACE/scripts/retry-on-download-failure.mjs" -- node "$GITHUB_WORKSPACE/scripts/tauri-cli/node_modules/@tauri-apps/cli/tauri.js" build --ci --bundles "$BUNDLES" --config "{\"version\":\"${VERSION}\",\"bundle\":{\"createUpdaterArtifacts\":true}}" -- --locked

      - name: Smoke test desktop shell window (embedded WebUI, IPC round trip and HWP editor round trip)
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "target/release/EasyOffice.exe" -ArgumentList @("--smoke") -PassThru
          $null = $proc.Handle # cache the process handle so ExitCode stays readable after exit
          if (-not $proc.WaitForExit(90000)) {
            Stop-Process -Id $proc.Id -Force
            throw "Desktop shell smoke test timed out"
          }
          if ($proc.ExitCode -ne 0) {
            throw "Desktop shell smoke test failed with exit code $($proc.ExitCode)"
          }

      # 7-Zip lists the files inside an NSIS installer without running it.
      - name: Verify the third-party notices and the PDF export font are inside the installer
        shell: bash
        run: |
          LISTING="$(7z l target/release/bundle/nsis/EasyOffice_*_x64-setup.exe)"
          for file in THIRD_PARTY_NOTICES.md NotoSansKR-Regular.ttf NotoSansKR-OFL.txt; do
            grep -qF "$file" <<<"$LISTING" || { echo "$file is missing from the NSIS installer"; exit 1; }
          done

      - name: Stage the Windows installer and its signature under their fixed names
        shell: bash
        run: node scripts/release-assets.mjs stage windows-x64 dist

      - name: Upload Windows x64 release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-windows-x64
          path: dist/
          if-no-files-found: error

  # x64 builds the AppImage, deb and rpm; arm64 builds the deb only. Both build on Ubuntu 22.04, which
  # sets the glibc baseline of the packages. The Linux GUI smoke test runs in CI (`verify-linux`), not here.
  build-linux-release:
    name: Build ${{ matrix.platform }} Release Artifacts
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out commit matches trigger SHA
        uses: ./.github/actions/assert-sha
        with:
          expected-sha: ${{ github.sha }}

      - name: Install the Linux build dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Run the shared release gates and prepare the editor bundle
        uses: ./.github/actions/prepare-desktop-build
        with:
          cache-key: ${{ matrix.platform }}-release

      - name: Build EasyOffice desktop shell signed Linux packages
        working-directory: crates/easyoffice-desktop
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          BUNDLES="$(node "$GITHUB_WORKSPACE/scripts/release-assets.mjs" bundles "$PLATFORM")"
          node "$GITHUB_WORKSPACE/scripts/retry-on-download-failure.mjs" -- node "$GITHUB_WORKSPACE/scripts/tauri-cli/node_modules/@tauri-apps/cli/tauri.js" build --ci --bundles "$BUNDLES" --config "{\"version\":\"${VERSION}\",\"bundle\":{\"createUpdaterArtifacts\":true}}" -- --locked

      - name: Verify the package structure (AppImage extraction, deb and rpm metadata, desktop entry, notices) and the signatures
        env:
          PLATFORM: ${{ matrix.platform }}
        run: node scripts/verify-linux-bundles.mjs "$PLATFORM" --signed

      - name: Stage the Linux packages and their signatures under their fixed names
        env:
          PLATFORM: ${{ matrix.platform }}
        run: node scripts/release-assets.mjs stage "$PLATFORM" dist

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  publish-release:
    name: Publish Combined GitHub Release
    needs: [prepare, release-macos, build-windows-release, build-linux-release]
    # publish=false (workflow_dispatch only) stops after the build jobs, leaving the Actions artifacts.
    if: needs.prepare.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    concurrency:
      group: release-publish-${{ needs.prepare.outputs.version }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `--generate-notes` (used when docs/releases/v<version>.md is missing) lists the merged pull
    # requests, which the token may read only with `pull-requests: read`; without it the release
    # create call fails with 403 "Resource not accessible by integration".
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Verify checked-out commit matches trigger SHA
        uses: ./.github/actions/assert-sha
        with:
          expected-sha: ${{ github.sha }}

      - name: Setup Node.js for release manifest and verification scripts
        uses: ./.github/actions/setup-node-ci
        with:
          node-version: "22"

      - name: Download the macOS, Windows and Linux release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      # latest.json is what the app's updater reads (releases/latest/download/latest.json): one entry per
      # platform key with the URL of this release's package and its signature. It fails unless every
      # package has a signature made for exactly this version, so an app that updated to this release
      # finds nothing newer.
      - name: Write latest.json from the signatures
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/release-assets.mjs manifest release-assets "$VERSION"

      # Fails unless release-assets holds exactly the release files (the assets, the macOS updater
      # archive, the signatures and latest.json); then writes the one combined SHA256SUMS.txt.
      - name: Write the combined SHA-256 checksums
        run: node scripts/release-assets.mjs checksums release-assets

      # The REST docs say a release create or update call fails (404, or 403 "Resource not accessible by
      # integration") when its target commit adds or changes files under .github/workflows relative to the
      # default branch, and that the Actions GITHUB_TOKEN cannot be authorized for it. The target here is the
      # commit this run was started on, and a build takes over an hour, so a workflow change pushed to main
      # in the meantime puts the target in that state. This step only records the evidence (it never writes
      # and never prints the token): the status and the permission headers of a release read, and the
      # workflow files that differ between the target and the default branch (PD-283).
      - name: Record the token's release access and the workflow drift of the target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          gh api -i "repos/$GITHUB_REPOSITORY/releases?per_page=1" 2>&1 | grep -iE '^(HTTP/|x-accepted-github-permissions:|x-github-request-id:)' || true
          DEFAULT_BRANCH=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch || true)
          if [ -n "$DEFAULT_BRANCH" ]; then
            DRIFT=$(gh api --paginate "repos/$GITHUB_REPOSITORY/compare/${TARGET_SHA}...${DEFAULT_BRANCH}" --jq '.files[]? | select(.filename | startswith(".github/workflows/")) | .filename' || true)
            if [ -n "$DRIFT" ]; then
              echo "::warning::The release target $TARGET_SHA differs from $DEFAULT_BRANCH in workflow files, so the release write may be refused with 403 (docs/DEVELOPMENT.md has the manual steps): $(echo "$DRIFT" | tr '\n' ' ')"
            fi
          fi

      # A draft stays invisible to /releases/latest, so neither the download links, the update notice nor
      # latest.json (PD-103) point at it until QA publishes it; a pre-release version (1.2.3-rc.1) is
      # flagged so /releases/latest never serves it either. A rerun only replaces the assets of a draft
      # (it also takes the notes file again); it never turns a published release back into a draft. The
      # release's target commit must match the assets (PD-146): a rerun on a draft (no tag yet) moves the
      # target to this commit and drops uploaded files this run does not have. A published release is
      # final (PD-283): its tag, body and assets are never written again, so a run that finds one fails
      # before any upload. The first write of each kind runs through `gh_logged`, which keeps only the
      # status and the permission and request-id headers of the API exchange for the next failure analysis.
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DRAFT: ${{ needs.prepare.outputs.draft }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh_logged() {
            local LOG STATUS=0
            LOG=$(mktemp)
            GH_DEBUG=api gh "$@" 2>"$LOG" || STATUS=$?
            grep -iE '^(< HTTP/|< x-accepted-github-permissions:|< x-github-request-id:)' "$LOG" >&2 || true
            if [ "$STATUS" -ne 0 ]; then
              tail -n 2 "$LOG" >&2
            fi
            return "$STATUS"
          }
          FILES=(release-assets/*)
          # Hand-written notes (docs/releases/v<version>.md) win over generated ones.
          NOTES_FILE="docs/releases/v${VERSION}.md"
          if IS_DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$IS_DRAFT" != true ]; then
              echo "::error::$TAG is already published; its assets are never replaced (PD-283)"
              exit 1
            fi
            EDIT_FLAGS=(--target "$TARGET_SHA" --repo "$GITHUB_REPOSITORY")
            if [ -f "$NOTES_FILE" ]; then
              EDIT_FLAGS+=(--notes-file "$NOTES_FILE")
            fi
            gh_logged release edit "$TAG" "${EDIT_FLAGS[@]}"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while read -r NAME; do
              if [ ! -e "release-assets/$NAME" ]; then
                gh release delete-asset "$TAG" "$NAME" --yes --repo "$GITHUB_REPOSITORY"
              fi
            done
            gh release upload "$TAG" "${FILES[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            if [ "$DRAFT" = false ]; then
              gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
            fi
          else
            FLAGS=(--target "$TARGET_SHA" --title "EasyOffice v${VERSION}" --repo "$GITHUB_REPOSITORY")
            if [ -f "$NOTES_FILE" ]; then
              FLAGS+=(--notes-file "$NOTES_FILE")
            else
              FLAGS+=(--generate-notes)
            fi
            if [ "$DRAFT" = true ]; then
              FLAGS+=(--draft)
            fi
            if [[ "$VERSION" == *-* ]]; then
              FLAGS+=(--prerelease)
            fi
            gh_logged release create "$TAG" "${FILES[@]}" "${FLAGS[@]}"
          fi

      - name: Verify uploaded release assets, manifest and public pointer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DRAFT: ${{ needs.prepare.outputs.draft }}
        run: node scripts/post-release-check.mjs --repo "$GITHUB_REPOSITORY" --tag "$TAG" --draft "$DRAFT"

  release-timings:
    name: Report Release Timing & Regressions
    needs: [release-macos, build-windows-release, build-linux-release, publish-release]
    if: always() && !cancelled() && needs.release-macos.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Verify checked-out commit matches trigger SHA
        uses: ./.github/actions/assert-sha
        with:
          expected-sha: ${{ github.sha }}

      - name: Setup Node.js for timing report
        uses: ./.github/actions/setup-node-ci
        with:
          node-version: "22"

      - name: Compute build timing comparison and report regressions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-timing-report.mjs
