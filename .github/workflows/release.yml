name: Release Packages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 2.1.0)"
        required: true
        default: "2.1.0"
      publish:
        description: "Publish the GitHub Release (false builds and uploads Actions artifacts only)"
        type: boolean
        required: false
        default: true

concurrency:
  group: release-${{ github.ref_name || inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A tag push must name the version the sources carry, or the app would ship with a stale version
  # (PD-103 compares it with the latest release). Runs first so a mismatch fails before any build.
  check-tag-version:
    name: Check Tag Matches Cargo Workspace Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Compare the tag version with the workspace package version
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          CARGO_VERSION="$(awk '/^\[workspace\.package\]/{in_pkg=1; next} /^\[/{in_pkg=0} in_pkg && /^version[[:space:]]*=/{gsub(/.*=[[:space:]]*"|".*/, ""); print; exit}' Cargo.toml)"
          test -n "$CARGO_VERSION"
          TAG_VERSION="${REF_NAME#v}"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag $REF_NAME does not match Cargo workspace version $CARGO_VERSION"
            exit 1
          fi

  release-macos:
    name: Build macOS Release Artifacts
    needs: check-tag-version
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Node.js for repository hygiene guard and the Tauri CLI
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Run repository hygiene guard
        run: node scripts/check-repo-hygiene.mjs

      - name: Run desktop bundle contract and WebUI regression suite
        run: node --test scripts/test-desktop-file-associations.mjs "scripts/test-webui-*.mjs"

      # The editor bundle (PD-081, PD-083) is generated, not tracked. The desktop shell embeds it and
      # fails to build without it, so build it before any Rust step.
      - name: Check out the pinned rhwp upstream and build the hwp-studio editor bundle
        run: |
          node scripts/checkout-rhwp.mjs
          node scripts/build-hwp-studio.mjs

      - name: Add the macOS Rust targets for the universal build
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Run Rust workspace test suite and self-test
        run: |
          cargo test --workspace
          cargo run -p easyoffice-app -- --self-test

      - name: Resolve release version and tag
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" == v* ]]; then
            VERSION="${REF_NAME#v}"
            TAG="$REF_NAME"
          else
            VERSION="${INPUT_VERSION#v}"
            TAG="v${VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Universal .dmg without a Developer ID (PD-094). The identity "-" is an ad-hoc signature (Apple
      # silicon refuses to run a binary without any signature; Gatekeeper still prompts on first open).
      # To sign and notarize later, add the APPLE_SIGNING_IDENTITY secret and pass APPLE_ID,
      # APPLE_PASSWORD and APPLE_TEAM_ID to this step; the Tauri CLI reads them from the environment.
      # The release version overrides the bundle version so the asset name, Info.plist and tag agree.
      - name: Build EasyOffice desktop shell universal .dmg
        working-directory: crates/easyoffice-desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: npx --yes --ignore-scripts @tauri-apps/cli@2.12.4 build --ci --target universal-apple-darwin --bundles app,dmg --config "{\"version\":\"${VERSION}\"}"

      - name: Smoke test desktop shell window (embedded WebUI, IPC round trip and HWP editor round trip)
        if: vars.MACOS_SMOKE != 'off'
        run: |
          set -u
          target/universal-apple-darwin/release/bundle/macos/EasyOffice.app/Contents/MacOS/EasyOffice --smoke &
          PID=$!
          for _ in $(seq 1 90); do
            kill -0 "$PID" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$PID" 2>/dev/null; then
            kill -9 "$PID" || true
            echo "Desktop shell smoke test timed out"
            exit 1
          fi
          wait "$PID" && CODE=0 || CODE=$?
          if [ "$CODE" -ne 0 ]; then
            echo "Desktop shell smoke test failed with exit code $CODE"
            exit 1
          fi

      - name: Stage macOS .dmg and SHA-256 checksums
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p dist
          DMG="$(ls target/universal-apple-darwin/release/bundle/dmg/EasyOffice_*_universal.dmg | head -n 1)"
          test -n "$DMG"
          cp "$DMG" "dist/EasyOffice-${VERSION}-macos-universal.dmg"
          (cd dist && shasum -a 256 "EasyOffice-${VERSION}-macos-universal.dmg" > "SHA256SUMS-macos-universal.txt")

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: macos-release-artifacts
          path: |
            dist/EasyOffice-${{ steps.meta.outputs.version }}-macos-universal.dmg
            dist/SHA256SUMS-macos-universal.txt
          if-no-files-found: error

  build-windows-release:
    name: Build Windows x64 Installer & Release Artifacts
    needs: check-tag-version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Node.js for repository hygiene guard and the Tauri CLI
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Run repository hygiene guard
        run: node scripts/check-repo-hygiene.mjs

      - name: Run WebUI behavioral and security regression suite
        run: node --test "scripts/test-webui-*.mjs"

      # The editor bundle (PD-081, PD-083) is generated, not tracked. The desktop shell embeds it and
      # fails to build without it, so build it before any Rust step.
      - name: Check out the pinned rhwp upstream and build the hwp-studio editor bundle
        run: |
          node scripts/checkout-rhwp.mjs
          node scripts/build-hwp-studio.mjs

      - name: Run Rust workspace test suite and self-test
        run: |
          cargo test --workspace
          cargo run -p easyoffice-app -- --self-test

      - name: Resolve release version and tag
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" == v* ]]; then
            VERSION="${REF_NAME#v}"
            TAG="$REF_NAME"
          else
            VERSION="${INPUT_VERSION#v}"
            TAG="v${VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Prebuilt Tauri CLI (major 2) from npm; it builds crates/easyoffice-desktop in release mode
      # with the WebUI embedded and packages it with NSIS. The release version overrides the
      # installer version so the asset name, installer metadata, and tag agree.
      - name: Build EasyOffice desktop shell and NSIS installer
        working-directory: crates/easyoffice-desktop
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: npx --yes --ignore-scripts @tauri-apps/cli@2.12.4 build --ci --bundles nsis --config "{\"version\":\"${VERSION}\"}"

      - name: Smoke test desktop shell window (embedded WebUI, IPC round trip and HWP editor round trip)
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "target/release/EasyOffice.exe" -ArgumentList @("--smoke") -PassThru
          $null = $proc.Handle # cache the process handle so ExitCode stays readable after exit
          if (-not $proc.WaitForExit(90000)) {
            Stop-Process -Id $proc.Id -Force
            throw "Desktop shell smoke test timed out"
          }
          if ($proc.ExitCode -ne 0) {
            throw "Desktop shell smoke test failed with exit code $($proc.ExitCode)"
          }

      - name: Stage Windows installer and SHA-256 checksums
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p dist
          INSTALLER="$(ls target/release/bundle/nsis/EasyOffice_*_x64-setup.exe | head -n 1)"
          test -n "$INSTALLER"
          cp "$INSTALLER" "dist/EasyOffice-${VERSION}-windows-x64-setup.exe"
          (cd dist && sha256sum "EasyOffice-${VERSION}-windows-x64-setup.exe" > "SHA256SUMS-windows-x64.txt")

      - name: Upload Windows x64 release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-release-artifacts
          path: |
            dist/EasyOffice-${{ steps.meta.outputs.version }}-windows-x64-setup.exe
            dist/SHA256SUMS-windows-x64.txt
          if-no-files-found: error

  publish-release:
    name: Publish Combined GitHub Release
    needs: [release-macos, build-windows-release]
    # publish=false (workflow_dispatch only) stops after the build jobs, leaving the Actions artifacts.
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download macOS and Windows release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-macos.outputs.tag }}
          VERSION: ${{ needs.release-macos.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          ASSETS=(
            "release-assets/EasyOffice-${VERSION}-macos-universal.dmg"
            "release-assets/SHA256SUMS-macos-universal.txt"
            "release-assets/EasyOffice-${VERSION}-windows-x64-setup.exe"
            "release-assets/SHA256SUMS-windows-x64.txt"
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$TARGET_SHA" \
              --title "EasyOffice v${VERSION} (macOS & Windows)" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
