name: Release Packages

# Reference implementation (MIT, Copyright (c) 2025-2026 Edward Kim) of the reference app's desktop
# release workflow (.github/workflows/*-desktop.yml): the Linux build matrix (x64 AppImage, deb and rpm;
# arm64 deb), the AppImage extraction check, fixed release asset names, one combined checksum file and
# the draft release, and its signed updater artifacts (createUpdaterArtifacts, a `.sig` per package, the
# `latest.json` manifest, the required signing key). The staging, the manifest and the checks are scripts
# here (scripts/release-assets.mjs, scripts/verify-linux-bundles.mjs) with unit tests; the shared build
# steps are composite actions (.github/actions). The macOS notarization of the reference is not taken
# over (PD-094); the update signature is the Tauri minisign key (PD-103).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true
        default: "0.1.0"
      publish:
        description: "Publish the GitHub Release (false builds and uploads Actions artifacts only)"
        type: boolean
        required: false
        default: true
      release_draft:
        description: "Create the release as a draft (QA publishes it after checking). A tag push always creates a draft."
        type: boolean
        required: false
        default: true

# Tag pushes group by tag. A manual run groups by version, publish flag and draft flag, so a trial
# build (publish=false) never queues behind or replaces a publishing run of the same version, and a
# queued request to publish a release is never cancelled by a draft request for the same version.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}-{1}-{2}', inputs.version, inputs.publish, inputs.release_draft) || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Resolves the version, tag and draft state once for every job. A tag push must name the version the
  # sources carry, or the app would ship with a stale version (PD-103 compares it with the latest
  # release); it runs first so a mismatch fails before any build.
  prepare:
    name: Resolve Release and Check Tag Matches Cargo Workspace Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      draft: ${{ steps.meta.outputs.draft }}
    steps:
      # First step, before anything uses the value: the version ends up in a tag, a JSON build
      # override and a release title, so only a plain semantic version passes. A release that is
      # public at once (release_draft=false) may only come from main.
      - name: Resolve and validate the release version, tag and draft state
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_DRAFT: ${{ inputs.release_draft }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # Every run signs its updater packages, a trial run (publish=false) included: a trial that skipped
          # the signing would not test the step that is most likely to fail. Without the key the build
          # cannot make the signatures the app requires, so stop before building anything.
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required: the updater packages must be signed (PD-103)"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The release version must look like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          # Only an explicit release_draft=false on a manual run publishes right away.
          DRAFT=true
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$INPUT_DRAFT" = false ]; then
            DRAFT=false
          fi
          if [ "$DRAFT" = false ] && [ "$INPUT_PUBLISH" = true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::A release that is public at once (release_draft=false) may only be created from main"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "draft=$DRAFT"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Compare the tag version with the workspace package version
        if: github.ref_type == 'tag'
        env:
          TAG_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          CARGO_VERSION="$(awk '/^\[workspace\.package\]/{in_pkg=1; next} /^\[/{in_pkg=0} in_pkg && /^version[[:space:]]*=/{gsub(/.*=[[:space:]]*"|".*/, ""); print; exit}' Cargo.toml)"
          test -n "$CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match Cargo workspace version $CARGO_VERSION"
            exit 1
          fi

  release-macos:
    name: Build macOS Release Artifacts
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Add the macOS Rust targets for the universal build
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Run the shared release gates and prepare the editor bundle
        uses: ./.github/actions/prepare-desktop-build

      # Universal .dmg without a Developer ID (PD-094). The identity "-" is an ad-hoc signature (Apple
      # silicon refuses to run a binary without any signature; Gatekeeper still prompts on first open).
      # To sign and notarize later, add the APPLE_SIGNING_IDENTITY secret and pass APPLE_ID,
      # APPLE_PASSWORD and APPLE_TEAM_ID to this step; the Tauri CLI reads them from the environment.
      # The release version overrides the bundle version so the Info.plist and the tag agree.
      # createUpdaterArtifacts adds the signed .app.tar.gz the app's updater installs (the signing key
      # comes from the secrets, only here; local and CI builds have no key and do not switch it on).
      - name: Build EasyOffice desktop shell universal .dmg and the signed updater archive
        working-directory: crates/easyoffice-desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          BUNDLES="$(node "$GITHUB_WORKSPACE/scripts/release-assets.mjs" bundles macos-universal)"
          npx --yes --ignore-scripts @tauri-apps/cli@2.12.4 build --ci --target universal-apple-darwin --bundles "$BUNDLES" --config "{\"version\":\"${VERSION}\",\"bundle\":{\"createUpdaterArtifacts\":true}}" -- --locked

      - name: Smoke test desktop shell window (embedded WebUI, IPC round trip and HWP editor round trip)
        if: vars.MACOS_SMOKE != 'off'
        run: |
          set -u
          target/universal-apple-darwin/release/bundle/macos/EasyOffice.app/Contents/MacOS/EasyOffice --smoke &
          PID=$!
          for _ in $(seq 1 90); do
            kill -0 "$PID" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$PID" 2>/dev/null; then
            kill -9 "$PID" || true
            echo "Desktop shell smoke test timed out"
            exit 1
          fi
          wait "$PID" && CODE=0 || CODE=$?
          if [ "$CODE" -ne 0 ]; then
            echo "Desktop shell smoke test failed with exit code $CODE"
            exit 1
          fi

      - name: Verify the third-party notices are inside the app
        run: test -f target/universal-apple-darwin/release/bundle/macos/EasyOffice.app/Contents/Resources/THIRD_PARTY_NOTICES.md

      - name: Stage the macOS .dmg and the signed updater archive under their fixed names
        run: node scripts/release-assets.mjs stage macos-universal dist

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-macos-universal
          path: dist/
          if-no-files-found: error

  build-windows-release:
    name: Build Windows x64 Installer & Release Artifacts
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Run the shared release gates and prepare the editor bundle
        uses: ./.github/actions/prepare-desktop-build

      # Prebuilt Tauri CLI (major 2) from npm; it builds crates/easyoffice-desktop in release mode
      # with the WebUI embedded and packages it with NSIS. The release version overrides the
      # installer version so the installer metadata and the tag agree.
      - name: Build EasyOffice desktop shell and the signed NSIS installer
        working-directory: crates/easyoffice-desktop
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          BUNDLES="$(node "$GITHUB_WORKSPACE/scripts/release-assets.mjs" bundles windows-x64)"
          npx --yes --ignore-scripts @tauri-apps/cli@2.12.4 build --ci --bundles "$BUNDLES" --config "{\"version\":\"${VERSION}\",\"bundle\":{\"createUpdaterArtifacts\":true}}" -- --locked

      - name: Smoke test desktop shell window (embedded WebUI, IPC round trip and HWP editor round trip)
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "target/release/EasyOffice.exe" -ArgumentList @("--smoke") -PassThru
          $null = $proc.Handle # cache the process handle so ExitCode stays readable after exit
          if (-not $proc.WaitForExit(90000)) {
            Stop-Process -Id $proc.Id -Force
            throw "Desktop shell smoke test timed out"
          }
          if ($proc.ExitCode -ne 0) {
            throw "Desktop shell smoke test failed with exit code $($proc.ExitCode)"
          }

      # 7-Zip lists the files inside an NSIS installer without running it.
      - name: Verify the third-party notices are inside the installer
        shell: bash
        run: 7z l target/release/bundle/nsis/EasyOffice_*_x64-setup.exe | grep -F THIRD_PARTY_NOTICES.md

      - name: Stage the Windows installer and its signature under their fixed names
        shell: bash
        run: node scripts/release-assets.mjs stage windows-x64 dist

      - name: Upload Windows x64 release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-windows-x64
          path: dist/
          if-no-files-found: error

  # x64 builds the AppImage, deb and rpm; arm64 builds the deb only. Both build on Ubuntu 22.04, which
  # sets the glibc baseline of the packages. The Linux GUI smoke test is not run yet (TODO.md).
  build-linux-release:
    name: Build ${{ matrix.platform }} Release Artifacts
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Install the Linux build dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Run the shared release gates and prepare the editor bundle
        uses: ./.github/actions/prepare-desktop-build

      - name: Build EasyOffice desktop shell signed Linux packages
        working-directory: crates/easyoffice-desktop
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          BUNDLES="$(node "$GITHUB_WORKSPACE/scripts/release-assets.mjs" bundles "$PLATFORM")"
          npx --yes --ignore-scripts @tauri-apps/cli@2.12.4 build --ci --bundles "$BUNDLES" --config "{\"version\":\"${VERSION}\",\"bundle\":{\"createUpdaterArtifacts\":true}}" -- --locked

      - name: Verify the package structure (AppImage extraction, deb and rpm metadata, desktop entry, notices) and the signatures
        env:
          PLATFORM: ${{ matrix.platform }}
        run: node scripts/verify-linux-bundles.mjs "$PLATFORM" --signed

      - name: Stage the Linux packages and their signatures under their fixed names
        env:
          PLATFORM: ${{ matrix.platform }}
        run: node scripts/release-assets.mjs stage "$PLATFORM" dist

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  publish-release:
    name: Publish Combined GitHub Release
    needs: [prepare, release-macos, build-windows-release, build-linux-release]
    # publish=false (workflow_dispatch only) stops after the build jobs, leaving the Actions artifacts.
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Download the macOS, Windows and Linux release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      # latest.json is what the app's updater reads (releases/latest/download/latest.json): one entry per
      # platform key with the URL of this release's package and its signature. It fails unless every
      # package has a signature made for exactly this version, so an app that updated to this release
      # finds nothing newer.
      - name: Write latest.json from the signatures
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/release-assets.mjs manifest release-assets "$VERSION"

      # Fails unless release-assets holds exactly the release files (the assets, the macOS updater
      # archive, the signatures and latest.json); then writes the one combined SHA256SUMS.txt.
      - name: Write the combined SHA-256 checksums
        run: node scripts/release-assets.mjs checksums release-assets

      # A draft stays invisible to /releases/latest, so neither the download links, the update notice nor
      # latest.json (PD-103) point at it until QA publishes it; a pre-release version (1.2.3-rc.1) is
      # flagged so /releases/latest never serves it either. A rerun on an existing release only replaces
      # its assets; it never turns a published release back into a draft.
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DRAFT: ${{ needs.prepare.outputs.draft }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          FILES=(release-assets/*)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            if [ "$DRAFT" = false ]; then
              gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
            fi
          else
            FLAGS=(--target "$TARGET_SHA" --title "EasyOffice v${VERSION}" --generate-notes --repo "$GITHUB_REPOSITORY")
            if [ "$DRAFT" = true ]; then
              FLAGS+=(--draft)
            fi
            if [[ "$VERSION" == *-* ]]; then
              FLAGS+=(--prerelease)
            fi
            gh release create "$TAG" "${FILES[@]}" "${FLAGS[@]}"
          fi
