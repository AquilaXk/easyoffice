name: Release Packages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

concurrency:
  group: release-${{ github.ref_name || inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-macos:
    name: Build macOS Release Artifacts
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js for repository hygiene guard
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run repository hygiene guard
        run: node scripts/check-repo-hygiene.mjs

      - name: Verify macOS LaunchServices Info.plist coverage
        run: node scripts/verify-macos-plist.mjs

      - name: Run WebUI behavioral and security regression suite
        run: node --test scripts/test-webui-behavior.mjs scripts/test-webui-ux-ergonomics.mjs scripts/test-webui-round13-parity.mjs scripts/test-webui-sheet-atomicity.mjs scripts/test-webui-security-ipc.mjs scripts/test-webui-session-context.mjs scripts/test-webui-save-fidelity.mjs scripts/test-webui-desktop-bridge.mjs scripts/test-webui-hwp-host.mjs

      - name: Run deterministic test suite before packaging
        run: swift test

      - name: Resolve release version and tag
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" == v* ]]; then
            VERSION="${REF_NAME#v}"
            TAG="$REF_NAME"
          else
            VERSION="${INPUT_VERSION#v}"
            TAG="v${VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build macOS .app bundle, .dmg, .zip, and SHA256SUMS.txt
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: bash scripts/package-macos-release.sh "$VERSION"

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-artifacts
          path: |
            dist/EasyOffice-${{ steps.meta.outputs.version }}-macos.dmg
            dist/EasyOffice-${{ steps.meta.outputs.version }}-macos.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  build-windows-release:
    name: Build Windows x64 Installer & Release Artifacts
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js for repository hygiene guard and the Tauri CLI
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run repository hygiene guard
        run: node scripts/check-repo-hygiene.mjs

      - name: Run WebUI behavioral and security regression suite
        run: node --test scripts/test-webui-behavior.mjs scripts/test-webui-ux-ergonomics.mjs scripts/test-webui-round13-parity.mjs scripts/test-webui-sheet-atomicity.mjs scripts/test-webui-security-ipc.mjs scripts/test-webui-session-context.mjs scripts/test-webui-save-fidelity.mjs scripts/test-webui-desktop-bridge.mjs scripts/test-webui-hwp-host.mjs

      # The editor bundle (PD-081, PD-083) is generated, not tracked. The desktop shell embeds it and
      # fails to build without it, so build it before any Rust step.
      - name: Check out the pinned rhwp upstream and build the hwp-studio editor bundle
        run: |
          node scripts/checkout-rhwp.mjs
          node scripts/build-hwp-studio.mjs

      - name: Run Rust workspace test suite and self-test
        run: |
          cargo test --workspace
          cargo run -p easyoffice-app -- --self-test

      - name: Resolve release version and tag
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" == v* ]]; then
            VERSION="${REF_NAME#v}"
            TAG="$REF_NAME"
          else
            VERSION="${INPUT_VERSION#v}"
            TAG="v${VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Prebuilt Tauri CLI (major 2) from npm; it builds crates/easyoffice-desktop in release mode
      # with the WebUI embedded and packages it with NSIS. The release version overrides the
      # installer version so the asset name, installer metadata, and tag agree.
      - name: Build EasyOffice desktop shell and NSIS installer
        working-directory: crates/easyoffice-desktop
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: npx --yes @tauri-apps/cli@2 build --ci --bundles nsis --config "{\"version\":\"${VERSION}\"}"

      - name: Smoke test desktop shell window (embedded WebUI, IPC round trip and HWP editor round trip)
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "target/release/EasyOffice.exe" -ArgumentList @("--smoke") -PassThru
          $null = $proc.Handle # cache the process handle so ExitCode stays readable after exit
          if (-not $proc.WaitForExit(90000)) {
            Stop-Process -Id $proc.Id -Force
            throw "Desktop shell smoke test timed out"
          }
          if ($proc.ExitCode -ne 0) {
            throw "Desktop shell smoke test failed with exit code $($proc.ExitCode)"
          }

      - name: Stage Windows installer and SHA-256 checksums
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p dist
          INSTALLER="$(ls target/release/bundle/nsis/EasyOffice_*_x64-setup.exe | head -n 1)"
          test -n "$INSTALLER"
          cp "$INSTALLER" "dist/EasyOffice-${VERSION}-windows-x64-setup.exe"
          (cd dist && sha256sum "EasyOffice-${VERSION}-windows-x64-setup.exe" > "SHA256SUMS-windows-x64.txt")

      - name: Upload Windows x64 release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-artifacts
          path: |
            dist/EasyOffice-${{ steps.meta.outputs.version }}-windows-x64-setup.exe
            dist/SHA256SUMS-windows-x64.txt
          if-no-files-found: error

  publish-release:
    name: Publish Combined GitHub Release
    needs: [release-macos, build-windows-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download macOS and Windows release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-macos.outputs.tag }}
          VERSION: ${{ needs.release-macos.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          ASSETS=(
            "release-assets/EasyOffice-${VERSION}-macos.dmg"
            "release-assets/EasyOffice-${VERSION}-macos.zip"
            "release-assets/SHA256SUMS.txt"
            "release-assets/EasyOffice-${VERSION}-windows-x64-setup.exe"
            "release-assets/SHA256SUMS-windows-x64.txt"
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$TARGET_SHA" \
              --title "EasyOffice v${VERSION} (macOS & Windows)" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
