name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for repository hygiene guard
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run repository hygiene & specification guard
        run: node scripts/check-repo-hygiene.mjs

      - name: Verify macOS LaunchServices Info.plist coverage
        run: node scripts/verify-macos-plist.mjs

      - name: Run WebUI behavioral and security regression suite
        run: node --test scripts/test-webui-behavior.mjs scripts/test-webui-ux-ergonomics.mjs scripts/test-webui-round13-parity.mjs scripts/test-webui-sheet-atomicity.mjs scripts/test-webui-security-ipc.mjs scripts/test-webui-session-context.mjs scripts/test-webui-save-fidelity.mjs

      - name: Check Swift toolchain version
        run: swift --version

      - name: Check Rust toolchain version
        run: cargo --version && rustc --version

      - name: Check Rust formatting across workspace
        run: cargo fmt --all -- --check

      - name: Run Rust Clippy lint gate across workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust cross-platform workspace test suite
        run: cargo test --workspace

      - name: Run Rust desktop host self-test
        run: cargo run -p easyoffice-app -- --self-test

      - name: Build all Swift targets
        run: swift build

      - name: Run deterministic test suite
        run: swift test

      - name: Verify macOS .app bundle packaging
        run: bash scripts/package-macos-release.sh 1.0.0-ci --verify-only

  verify-windows:
    name: Verify Rust Core & Tauri Shell (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for repository hygiene guard
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run repository hygiene & specification guard
        run: node scripts/check-repo-hygiene.mjs

      - name: Run WebUI behavioral and security regression suite
        run: node --test scripts/test-webui-behavior.mjs scripts/test-webui-ux-ergonomics.mjs scripts/test-webui-round13-parity.mjs scripts/test-webui-sheet-atomicity.mjs scripts/test-webui-security-ipc.mjs scripts/test-webui-session-context.mjs scripts/test-webui-save-fidelity.mjs

      - name: Check Rust toolchain version
        run: cargo --version && rustc --version

      - name: Check Rust formatting across workspace
        run: cargo fmt --all -- --check

      - name: Run Rust Clippy lint gate across workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust cross-platform workspace test suite (Windows)
        run: cargo test --workspace

      - name: Run Rust desktop host self-test (Windows)
        run: cargo run -p easyoffice-app -- --self-test

      - name: Smoke test Windows x64 --serve loopback WebUI and CSP header
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "target/debug/easyoffice-app.exe" -ArgumentList @("--serve", "18787") -PassThru -NoNewWindow
          try {
            $resp = $null
            for ($i = 0; $i -lt 20; $i++) {
              try {
                $candidate = Invoke-WebRequest -Uri "http://127.0.0.1:18787/" -UseBasicParsing -TimeoutSec 2
                if ($candidate.StatusCode -eq 200) {
                  $resp = $candidate
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if ($null -eq $resp -or $resp.StatusCode -ne 200) {
              throw "Windows --serve loopback smoke test failed to return HTTP 200"
            }
            $csp = ($resp.Headers["Content-Security-Policy"] -join ", ").Trim()
            if ($csp -ne "default-src 'self'") {
              throw "Unexpected Content-Security-Policy header: '$csp'"
            }
          } finally {
            if ($null -ne $proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
          }
