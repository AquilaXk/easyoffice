name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# The desktop shell crate (crates/easyoffice-desktop, Tauri v2: WebView2 on Windows, WKWebView on
# macOS, WebKitGTK on Linux) is excluded from the cross-platform engine gates and verified on its own in
# the macOS (`verify`), Windows and Linux (`verify-linux`) jobs: its build needs the platform toolchain
# and webview (PD-074, PD-094).

jobs:
  # Platform-independent gates run once on the fastest runner; the OS jobs keep only what needs their OS
  # (desktop shell, .app and .dmg on macOS; engine tests, desktop shell and installer on Windows; desktop
  # shell and the deb, rpm and AppImage packages on Linux).
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js for repository hygiene guard
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Run repository hygiene & specification guard
        run: node scripts/check-repo-hygiene.mjs

      # Work is pushed straight to main: reject tool names, external brands and attribution
      # trailers in the pushed commits (same list as the hygiene guard).
      - name: Check pushed commit messages
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth=200 origin "$BASE_SHA" "$HEAD_SHA"
          node scripts/check-commit-messages.mjs "$BASE_SHA" "$HEAD_SHA"

      - name: Verify rhwp upstream pin (no submodule checkout)
        run: node scripts/verify-rhwp-upstream.mjs

      - name: Verify vendored rhwp WASM provenance and bundled fonts (no WASM build in CI)
        run: |
          node scripts/verify-rhwp-core.mjs
          node scripts/verify-fonts.mjs

      # Every scripts/test-*.mjs suite (guards, hwp-studio and the WebUI behavioral and security suites) runs
      # once; the lcov report covers the WebUI scripts, the editor overlay sources and the guard scripts.
      - name: Run Node test suites with coverage
        run: |
          mkdir -p coverage
          node --test --experimental-test-coverage \
            --test-coverage-include="crates/easyoffice-app/ui/*.js" \
            --test-coverage-include="apps/hwp-studio/src/**/*.ts" \
            --test-coverage-include="scripts/*.mjs" \
            --test-coverage-exclude="scripts/test-*.mjs" \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=coverage/js.lcov \
            "scripts/test-*.mjs"

      - name: Upload the JavaScript coverage report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: js-coverage-lcov
          path: coverage/js.lcov
          retention-days: 7
          if-no-files-found: error

      # Cargo reads the manifest of every workspace dependency, and the desktop shell (excluded from
      # the builds below) depends on this checkout (PD-142). It is not compiled in this job.
      - name: Check out the pinned rhwp upstream (sparse, shallow)
        run: node scripts/checkout-rhwp.mjs

      - name: Set up the pinned Rust toolchain (PD-147)
        id: rust
        uses: ./.github/actions/setup-rust

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: rust-${{ steps.rust.outputs.version }}

      - name: Check Rust toolchain version
        run: cargo --version && rustc --version

      - name: Check Rust formatting across workspace
        run: cargo fmt --all -- --check

      - name: Run Rust Clippy lint gate across engine crates
        run: cargo clippy --workspace --exclude easyoffice-desktop --all-targets -- -D warnings

      - name: Run Rust cross-platform engine test suite
        run: cargo test --workspace --exclude easyoffice-desktop

      - name: Run Rust engine self-test
        run: cargo run -p easyoffice-app -- --self-test

  # Static analysis runs in parallel with the OS jobs, after the coverage report exists. A missing
  # token (fork pull requests) skips the scan; an analysis failure fails the run.
  sonar:
    name: sonar
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout repository
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Download the JavaScript coverage report
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: js-coverage-lcov
          path: coverage

      - name: Run the static analysis scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1

  verify:
    name: verify
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js for the hwp-studio bundle build and the Tauri CLI
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/hwp-studio/package-lock.json

      - name: Set up the pinned Rust toolchain (PD-147)
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-darwin x86_64-apple-darwin

      # The Quick Look extensions (PD-140) are their own Cargo workspace with their own target directory.
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: rust-${{ steps.rust.outputs.version }}
          workspaces: |
            . -> target
            apps/quicklook/rust -> target

      # The desktop shell embeds the generated editor bundle (frontendDist) and fails to build without it.
      - name: Check out the pinned rhwp upstream (sparse, shallow)
        run: node scripts/checkout-rhwp.mjs

      - name: Build the hwp-studio editor bundle (npm ci --ignore-scripts, vite build, static checks)
        run: node scripts/build-hwp-studio.mjs

      - name: Check Rust toolchain version
        run: cargo --version && rustc --version

      - name: Run Rust Clippy lint gate for the desktop shell (macOS)
        run: cargo clippy -p easyoffice-desktop --all-targets -- -D warnings

      - name: Run desktop shell unit tests (macOS)
        run: cargo test -p easyoffice-desktop

      - name: Run the Quick Look crate checks (format, Clippy, tests with hostile files)
        run: node scripts/run-quicklook-tests.mjs

      # The extensions go into EasyOffice.app/Contents/PlugIns through bundle.macOS.files, so they are
      # built first. Universal like the release; ad-hoc signed (PD-094) with the sandbox entitlements.
      - name: Build the Quick Look preview and thumbnail extensions (universal, ad-hoc signed)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
        run: |
          node scripts/build-quicklook-macos.mjs --universal

      # No Developer ID in CI or in the repository (PD-094). The identity "-" is an ad-hoc signature:
      # Apple silicon refuses to run a binary without any signature, and it is not a trusted identity
      # (Gatekeeper still prompts). A real certificate is added later through the APPLE_SIGNING_IDENTITY
      # secret (plus the notarization variables); nothing else changes.
      - name: Build desktop shell .app and .dmg (ad-hoc signed, not notarized)
        working-directory: crates/easyoffice-desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
        run: node "$GITHUB_WORKSPACE/scripts/retry-on-download-failure.mjs" -- npx --yes --ignore-scripts @tauri-apps/cli@2.12.4 build --ci --bundles app,dmg

      - name: Verify .app and .dmg output
        run: |
          set -euo pipefail
          APP="target/release/bundle/macos/EasyOffice.app"
          test -x "$APP/Contents/MacOS/EasyOffice" || { echo "missing $APP/Contents/MacOS/EasyOffice"; exit 1; }
          test -f "$APP/Contents/Info.plist" || { echo "missing Info.plist"; exit 1; }
          APP_KB=$(du -sk "$APP" | cut -f1)
          echo "EasyOffice.app: ${APP_KB} KiB"
          test "$APP_KB" -ge 5120 || { echo "EasyOffice.app is unexpectedly small"; exit 1; }
          # Info.plist must carry the document types and the minimum system version from tauri.conf.json.
          PLIST="$APP/Contents/Info.plist"
          plutil -extract CFBundleDocumentTypes xml1 -o - "$PLIST" > document-types.xml
          for ext in hwp hwpx docx odt xlsx ods pptx odp pdf; do
            grep -q "<string>${ext}</string>" document-types.xml || { echo "Info.plist does not register .${ext}"; exit 1; }
          done
          test "$(plutil -extract LSMinimumSystemVersion raw "$PLIST")" = "11.0"
          # The MIT notice condition: the third-party notices travel inside the app.
          test -f "$APP/Contents/Resources/THIRD_PARTY_NOTICES.md" || { echo "missing THIRD_PARTY_NOTICES.md in the app"; exit 1; }
          # The PDF export font (PD-114): without it Korean text is lost on a machine with no Korean font.
          for font in NotoSansKR-Regular.ttf NotoSansKR-OFL.txt; do
            test -f "$APP/Contents/Resources/pdf-fonts/$font" || { echo "missing pdf-fonts/$font in the app"; exit 1; }
          done
          DMGS=(target/release/bundle/dmg/EasyOffice_*.dmg)
          test "${#DMGS[@]}" -eq 1 && test -f "${DMGS[0]}" || { echo "expected exactly one EasyOffice .dmg"; exit 1; }
          DMG_BYTES=$(stat -f%z "${DMGS[0]}")
          echo "${DMGS[0]}: ${DMG_BYTES} bytes"
          test "$DMG_BYTES" -ge 1048576 || { echo ".dmg is unexpectedly small"; exit 1; }

      - name: Verify the Quick Look extensions are inside the app (identity, types, sandbox, both architectures)
        run: node scripts/verify-quicklook-bundle.mjs target/release/bundle/macos/EasyOffice.app --archs arm64,x86_64

      # The hosted macOS runner has a logged-in GUI session, so WKWebView can open a window. If a
      # runner image ever changes that, set the repository variable MACOS_SMOKE=off to skip this
      # step without editing the workflow (the build and bundle checks above still gate).
      - name: Smoke test desktop shell window (embedded WebUI, IPC round trip and HWP editor round trip)
        if: vars.MACOS_SMOKE != 'off'
        run: |
          set -u
          target/release/bundle/macos/EasyOffice.app/Contents/MacOS/EasyOffice --smoke &
          PID=$!
          for _ in $(seq 1 90); do
            kill -0 "$PID" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$PID" 2>/dev/null; then
            kill -9 "$PID" || true
            echo "Desktop shell smoke test timed out"
            exit 1
          fi
          wait "$PID" && CODE=0 || CODE=$?
          if [ "$CODE" -ne 0 ]; then
            echo "Desktop shell smoke test failed with exit code $CODE"
            exit 1
          fi

      - name: Upload .dmg for review
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: easyoffice-macos-dmg-ci
          path: target/release/bundle/dmg/EasyOffice_*.dmg
          retention-days: 7
          if-no-files-found: error

  # The Linux desktop shell builds on Ubuntu 22.04, the baseline the release packages are built on. The
  # fast `checks` job stays free of the WebKitGTK packages. The x64 packages are built and their
  # structure is checked as in the release; the arm64 deb is built only by the release. The release
  # binary then runs the same `--smoke` GUI test as macOS and Windows, on a virtual X display.
  verify-linux:
    name: verify-linux
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install the Linux build dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Setup Node.js for the hwp-studio bundle build and the Tauri CLI
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/hwp-studio/package-lock.json

      - name: Set up the pinned Rust toolchain (PD-147)
        id: rust
        uses: ./.github/actions/setup-rust

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: rust-${{ steps.rust.outputs.version }}

      - name: Check out the pinned rhwp upstream (sparse, shallow)
        run: node scripts/checkout-rhwp.mjs

      - name: Build the hwp-studio editor bundle (npm ci --ignore-scripts, vite build, static checks)
        run: node scripts/build-hwp-studio.mjs

      - name: Check Rust toolchain version
        run: cargo --version && rustc --version

      - name: Run Rust Clippy lint gate for the desktop shell (Linux)
        run: cargo clippy -p easyoffice-desktop --all-targets -- -D warnings

      - name: Run desktop shell unit tests (Linux)
        run: cargo test -p easyoffice-desktop

      - name: Cache the Tauri bundler tools (linuxdeploy, AppRun)
        uses: ./.github/actions/cache-tauri-tools
        with:
          tauri-cli-version: 2.12.4

      # The bundler downloads its tools from GitHub releases; a 5xx there is retried, anything else is not.
      - name: Build desktop shell Linux x64 packages
        working-directory: crates/easyoffice-desktop
        run: |
          BUNDLES="$(node "$GITHUB_WORKSPACE/scripts/release-assets.mjs" bundles linux-x64)"
          node "$GITHUB_WORKSPACE/scripts/retry-on-download-failure.mjs" -- npx --yes --ignore-scripts @tauri-apps/cli@2.12.4 build --ci --bundles "$BUNDLES"

      - name: Verify the package structure (AppImage extraction, deb and rpm metadata, desktop entry, notices)
        run: node scripts/verify-linux-bundles.mjs linux-x64

      # WebKitGTK needs a display: Xvfb provides one. The binary prints one EASYOFFICE_SMOKE_STEP_OK or
      # _FAIL line per step; `timeout` ends a hang (the app's own watchdog is 75 s).
      - name: Smoke test desktop shell window (embedded WebUI, IPC round trip and HWP editor round trip)
        run: |
          set +e
          timeout -k 5 100 xvfb-run -a -s "-screen 0 1280x1024x24" target/release/EasyOffice --smoke
          CODE=$?
          if [ "$CODE" -eq 124 ]; then
            echo "Desktop shell smoke test timed out"
            exit 1
          fi
          if [ "$CODE" -ne 0 ]; then
            echo "Desktop shell smoke test failed with exit code $CODE"
            exit 1
          fi

      - name: Upload Linux packages for review
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: easyoffice-linux-x64-ci
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
          retention-days: 7
          if-no-files-found: error

  verify-windows:
    name: Verify Rust Core & Tauri Shell (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js for the hwp-studio bundle build
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/hwp-studio/package-lock.json

      # The release runs this guard on Windows (CRLF checkout), so CI does too (PD-091).
      - name: Run repository hygiene guard on a Windows checkout
        run: node scripts/check-repo-hygiene.mjs

      - name: Set up the pinned Rust toolchain (PD-147)
        id: rust
        uses: ./.github/actions/setup-rust

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: rust-${{ steps.rust.outputs.version }}

      # hwp-studio (PD-081, PD-083): the editor bundle is generated from the committed WASM package, the
      # pinned sparse rhwp checkout and the npm lockfile; the WASM is never compiled here. The desktop shell
      # embeds it (frontendDist) and its build fails without it, so it is built before any desktop step.
      - name: Check out the pinned rhwp upstream (sparse, shallow)
        run: node scripts/checkout-rhwp.mjs

      - name: Build the hwp-studio editor bundle (npm ci --ignore-scripts, vite build, static checks)
        run: node scripts/build-hwp-studio.mjs
      - name: Verify desktop icons match the generator
        run: node scripts/generate-desktop-icons.mjs --check

      - name: Check Rust toolchain version
        run: cargo --version && rustc --version

      - name: Run Rust cross-platform engine test suite (Windows)
        run: cargo test --workspace --exclude easyoffice-desktop

      - name: Run Rust engine self-test (Windows)
        run: cargo run -p easyoffice-app -- --self-test

      - name: Engine self-test and bundle serving with the editor embedded in the CLI binary
        run: |
          cargo test -p easyoffice-app --features embed-hwp-studio
          cargo run -p easyoffice-app --features embed-hwp-studio -- --self-test
      - name: Smoke test Windows x64 --serve loopback WebUI and CSP header
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "target/debug/easyoffice-app.exe" -ArgumentList @("--serve", "18787") -PassThru -NoNewWindow
          try {
            $resp = $null
            for ($i = 0; $i -lt 20; $i++) {
              try {
                $candidate = Invoke-WebRequest -Uri "http://127.0.0.1:18787/" -UseBasicParsing -TimeoutSec 2
                if ($candidate.StatusCode -eq 200) {
                  $resp = $candidate
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if ($null -eq $resp -or $resp.StatusCode -ne 200) {
              throw "Windows --serve loopback smoke test failed to return HTTP 200"
            }
            $csp = ($resp.Headers["Content-Security-Policy"] -join ", ").Trim()
            if ($csp -ne "default-src 'self'") {
              throw "Unexpected Content-Security-Policy header: '$csp'"
            }
          } finally {
            if ($null -ne $proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
          }

      - name: Run Rust Clippy lint gate for the desktop shell
        run: cargo clippy -p easyoffice-desktop --all-targets -- -D warnings

      - name: Run desktop shell unit tests
        run: cargo test -p easyoffice-desktop

      # The prebuilt Tauri CLI from npm (major 2) avoids compiling tauri-cli from source on every
      # run (several minutes); it downloads the NSIS toolset itself.
      - name: Cache the Tauri bundler tools (NSIS)
        uses: ./.github/actions/cache-tauri-tools
        with:
          tauri-cli-version: 2.12.4

      - name: Build desktop shell release binary and NSIS installer
        working-directory: crates/easyoffice-desktop
        shell: bash
        run: node "$GITHUB_WORKSPACE/scripts/retry-on-download-failure.mjs" -- npx --yes --ignore-scripts @tauri-apps/cli@2.12.4 build --ci --bundles nsis

      - name: Verify NSIS installer output
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path "target/release/bundle/nsis" -Filter "EasyOffice_*_x64-setup.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one EasyOffice NSIS installer, found $($installers.Count)"
          }
          if ($installers[0].Length -lt 1MB) {
            throw "NSIS installer is unexpectedly small: $($installers[0].Length) bytes"
          }
          Write-Output "Installer: $($installers[0].Name) ($($installers[0].Length) bytes)"
          # 7-Zip lists the files inside an NSIS installer without running it: the third-party notices
          # (MIT notice condition) must be among them.
          $listing = & 7z l $installers[0].FullName
          if (-not ($listing | Select-String -SimpleMatch "THIRD_PARTY_NOTICES.md")) {
            throw "THIRD_PARTY_NOTICES.md is missing from the NSIS installer"
          }
          foreach ($font in @("NotoSansKR-Regular.ttf", "NotoSansKR-OFL.txt")) {
            if (-not ($listing | Select-String -SimpleMatch $font)) {
              throw "$font (PDF export font) is missing from the NSIS installer"
            }
          }

      # Same switch as MACOS_SMOKE: set the repository variable WINDOWS_SMOKE=off to skip the GUI smoke test
      # and the editor harness if a runner image stops providing a desktop session.
      - name: Smoke test desktop shell window (embedded WebUI, IPC round trip and HWP editor round trip)
        id: windows-smoke
        if: vars.WINDOWS_SMOKE != 'off'
        timeout-minutes: 4
        shell: pwsh
        run: |
          # The release binary has no console; redirected output files carry the per-step
          # EASYOFFICE_SMOKE_STEP_OK / EASYOFFICE_SMOKE_STEP_FAIL lines into the job log.
          $proc = Start-Process -FilePath "target/release/EasyOffice.exe" -ArgumentList @("--smoke") -PassThru -RedirectStandardOutput smoke-stdout.txt -RedirectStandardError smoke-stderr.txt
          $null = $proc.Handle # cache the process handle so ExitCode stays readable after exit
          $finished = $proc.WaitForExit(90000)
          if (-not $finished) {
            Stop-Process -Id $proc.Id -Force
          }
          foreach ($log in @("smoke-stdout.txt", "smoke-stderr.txt")) {
            Write-Output "::group::$log"
            Get-Content -Path $log -ErrorAction SilentlyContinue
            Write-Output "::endgroup::"
          }
          if (-not $finished) {
            throw "Desktop shell smoke test timed out"
          }
          if ($proc.ExitCode -ne 0) {
            throw "Desktop shell smoke test failed with exit code $($proc.ExitCode)"
          }

      - name: Upload the desktop shell smoke logs on failure
        if: failure() && steps.windows-smoke.outcome == 'failure'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: easyoffice-windows-smoke-logs
          path: |
            smoke-stdout.txt
            smoke-stderr.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Run the standalone hwp-studio harness (blank document, partial font size, export, reload)
        if: vars.WINDOWS_SMOKE != 'off'
        timeout-minutes: 6
        run: node scripts/hwp-studio-harness.mjs

      - name: Record the hwp-studio bundle size
        shell: pwsh
        run: |
          node scripts/check-hwp-studio-bundle.mjs | Tee-Object -Variable sizes
          "### hwp-studio bundle" >> $env:GITHUB_STEP_SUMMARY
          $sizes >> $env:GITHUB_STEP_SUMMARY

      - name: Upload NSIS installer for review
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: easyoffice-windows-installer-ci
          path: target/release/bundle/nsis/EasyOffice_*_x64-setup.exe
          retention-days: 7
          if-no-files-found: error
