name: Latest Release Guard

on:
  release:
    types: [published, released]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: latest-guard
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-latest:
    name: Verify /releases/latest pointer and assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: ./.github/actions/setup-node-ci
        with:
          node-version: "22"

      - name: Verify published latest release integrity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/latest-guard.mjs
