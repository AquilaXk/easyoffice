[workspace]
resolver = "2"
members = [
    "crates/easyoffice-formats",
    "crates/easyoffice-sheet",
    "crates/easyoffice-layout",
    "crates/easyoffice-app",
    "crates/easyoffice-desktop",
]
# Plain `cargo build`/`cargo test` cover the cross-platform engine crates. The Windows desktop shell
# (Tauri v2 / WebView2) is built with `-p easyoffice-desktop` or `--workspace` on the MSVC toolchain.
default-members = [
    "crates/easyoffice-formats",
    "crates/easyoffice-sheet",
    "crates/easyoffice-layout",
    "crates/easyoffice-app",
]

# PD-269: the engine crates use maintained crates under permissive licences instead of re-implementing
# them. The versions here are the ones the desktop shell and the rhwp checkout already resolve, so
# `Cargo.lock` gains no second copy of any of them.
[workspace.dependencies]
crc32fast = "1.5"
base64 = "0.23"
encoding_rs = "0.8"
miniz_oxide = "0.9"
adler2 = "2"
# The engine lays out ZIP archives with `zip` but compresses with its own DEFLATE adapter, so no
# compression feature of `zip` is on (the output must not depend on what else is linked).
flate2 = "1"
zip = { version = "8", default-features = false }
sha1 = "0.11"
sha2 = "0.11"
# XML tokenizer behind `xml_stream.rs` (PD-269, step 3): the version the desktop shell and rhwp resolve.
quick-xml = { version = "0.42", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
sse-core = { version = "0.2", default-features = false, features = ["std"] }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"

# PD-101: the desktop shell turns page SVGs into searchable PDFs with svg2pdf. rhwp pins a vendored
# copy with deterministic object order and PDF fixes; the patch only affects crates that depend on
# svg2pdf (the engine crates do not).
[patch.crates-io]
svg2pdf = { path = "vendor/svg2pdf" }
# PD-266: the PDF studio keeps optional content, so the page copier must not strip `/OC` and must copy
# an object on request (`vendor/hayro-write/PATCHES.md`; a few lines on top of 0.9.0, nothing else).
hayro-write = { path = "vendor/hayro-write" }
# PD-142: the shell draws the first page of a Hangul document with the pinned rhwp checkout
# (`config/rhwp-upstream.json`; the crates.io release is a different version). It is a patch, not
# a `path` dependency, because `cargo fmt --all` follows path dependencies into the sparse checkout
# and fails there, while it skips registry ones.
rhwp = { path = "third_party/rhwp" }

# PD-269: the engine's parsers and codecs are crates now. Unoptimised (debug) builds of them made the
# linear-time budget tests in `amplification_budget_pd262.rs` several times slower than the code they
# replaced, so dev and test builds optimise these crates while the workspace crates stay debuggable.
[profile.dev.package.quick-xml]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.zip]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
