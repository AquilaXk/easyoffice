[workspace]
resolver = "2"
members = [
    "crates/easyoffice-formats",
    "crates/easyoffice-sheet",
    "crates/easyoffice-layout",
    "crates/easyoffice-app",
    "crates/easyoffice-desktop",
]
# Plain `cargo build`/`cargo test` cover the cross-platform engine crates. The Windows desktop shell
# (Tauri v2 / WebView2) is built with `-p easyoffice-desktop` or `--workspace` on the MSVC toolchain.
default-members = [
    "crates/easyoffice-formats",
    "crates/easyoffice-sheet",
    "crates/easyoffice-layout",
    "crates/easyoffice-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

# PD-101: the desktop shell turns page SVGs into searchable PDFs with svg2pdf. rhwp pins a vendored
# copy with deterministic object order and PDF fixes; the patch only affects crates that depend on
# svg2pdf (the engine crates do not).
[patch.crates-io]
svg2pdf = { path = "vendor/svg2pdf" }
