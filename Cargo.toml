[workspace]
resolver = "2"
members = [
    "crates/easyoffice-formats",
    "crates/easyoffice-sheet",
    "crates/easyoffice-layout",
    "crates/easyoffice-app",
    "crates/easyoffice-desktop",
]
# Plain `cargo build`/`cargo test` cover the cross-platform engine crates. The Windows desktop shell
# (Tauri v2 / WebView2) is built with `-p easyoffice-desktop` or `--workspace` on the MSVC toolchain.
default-members = [
    "crates/easyoffice-formats",
    "crates/easyoffice-sheet",
    "crates/easyoffice-layout",
    "crates/easyoffice-app",
]

# PD-268: the engine crates use maintained crates under permissive licences instead of re-implementing
# them. The versions here are the ones the desktop shell and the rhwp checkout already resolve, so
# `Cargo.lock` gains no second copy of any of them.
[workspace.dependencies]
crc32fast = "1.5"
base64 = "0.23"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"

# PD-101: the desktop shell turns page SVGs into searchable PDFs with svg2pdf. rhwp pins a vendored
# copy with deterministic object order and PDF fixes; the patch only affects crates that depend on
# svg2pdf (the engine crates do not).
[patch.crates-io]
svg2pdf = { path = "vendor/svg2pdf" }
# PD-266: the PDF studio keeps optional content, so the page copier must not strip `/OC` and must copy
# an object on request (`vendor/hayro-write/PATCHES.md`; a few lines on top of 0.9.0, nothing else).
hayro-write = { path = "vendor/hayro-write" }
# PD-142: the shell draws the first page of a Hangul document with the pinned rhwp checkout
# (`config/rhwp-upstream.json`; the crates.io release is a different version). It is a patch, not
# a `path` dependency, because `cargo fmt --all` follows path dependencies into the sparse checkout
# and fails there, while it skips registry ones.
rhwp = { path = "third_party/rhwp" }
