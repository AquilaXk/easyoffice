[package]
name = "easyoffice-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "easyoffice_app"
path = "src/lib.rs"

[[bin]]
name = "easyoffice-app"
path = "src/main.rs"

[features]
# Embeds the generated hwp-studio bundle (ui/hwp-studio) into the executable for `--serve`; the
# bundle must be built first (scripts/build-hwp-studio.mjs). Off by default (PD-083).
embed-hwp-studio = []

[dependencies]
easyoffice-formats = { path = "../easyoffice-formats" }
easyoffice-sheet = { path = "../easyoffice-sheet" }
easyoffice-layout = { path = "../easyoffice-layout" }
