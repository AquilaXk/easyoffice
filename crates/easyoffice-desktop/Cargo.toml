[package]
name = "easyoffice-desktop"
version.workspace = true
edition.workspace = true
# Tauri v2 (tauri, tauri-build, tauri-plugin-dialog 2.x) requires Rust 1.90; the engine crates keep
# the workspace MSRV 1.85 (docs/policy-decisions.md PD-074).
rust-version = "1.90"
license.workspace = true
description = "EasyOffice Windows desktop shell (Tauri v2 / WebView2) hosting the embedded WebUI"

[[bin]]
name = "EasyOffice"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
easyoffice-app = { path = "../easyoffice-app" }
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
