[package]
name = "easyoffice-desktop"
version.workspace = true
edition.workspace = true
# Tauri v2 (tauri, tauri-build, tauri-plugin-dialog 2.x) requires Rust 1.90 and the pinned rhwp
# (PD-142) builds with 1.93; the engine crates keep the workspace MSRV 1.85 (PD-074).
rust-version = "1.93"
license.workspace = true
description = "EasyOffice desktop shell (Tauri v2: WebView2 on Windows, WKWebView on macOS) hosting the embedded WebUI"

[[bin]]
name = "EasyOffice"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
easyoffice-app = { path = "../easyoffice-app" }
easyoffice-formats = { path = "../easyoffice-formats" }
# PD-179: the grid of a spreadsheet card shows formula values.
easyoffice-sheet = { path = "../easyoffice-sheet" }
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
# Random per-window command token (shell_caller.rs): the version tauri already uses.
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
# PD-101: searchable PDF export of the Hangul editor's page SVGs (shell only; the engine crates stay
# dependency-free, PD-053/095).
svg2pdf = { version = "0.13", default-features = false, features = ["text"] }
usvg = { version = "0.45", default-features = false, features = ["text"] }
fontdb = "0.23"
# PD-132: the first page of a saved Hangul document drawn to a small PNG for the file's preview
# picture. Both crates are already in the graph through svg2pdf (same versions). `raster-images`
# (gif, image-webp, zune-jpeg) is on: the vendored svg2pdf's `filters` feature, which rhwp's default
# features turn on, enables it for the whole build, so it is named here instead of left to chance.
# Pictures are bounded by `raster_budget` before they are decoded (PD-145).
resvg = { version = "0.45", default-features = false, features = ["text", "raster-images"] }
# The picture size in a header, read before a decoder allocates for it; already in the graph through
# usvg.
imagesize = "0.13"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "png-format"] }
pdf-writer = "0.12"
# PD-170: editing a PDF keeps the original's objects (pictures, fonts, layout). `hayro-syntax` reads the
# file (the edit path asks for no image decoders because it copies pages and never draws them; the
# card renderer below turns them on for the whole build), `hayro-write` copies a page and the
# objects it uses into a new file, and `flate2` (already in the graph through it) counts what a
# stream inflates to before anything allocates for it. Shell only: the engine crates stay
# dependency-free (PD-053/095).
hayro-syntax = { version = "0.9", default-features = false, features = ["std"] }
hayro-write = "0.9"
flate2 = "1"
# PD-179: the first page of a recent PDF as a start-window card picture, drawn in the PDF worker process
# (`pdf_first_page.rs`). Default features: the standard-font substitutes and the predefined CMaps.
hayro = "0.9"
# PD-142: the first page of a recent document without a preview picture. Parser and layout only (no
# `native-skia`, so no Skia download); the pages come out as SVG that the crates above draw. The
# workspace `[patch.crates-io]` points this at the pinned checkout `third_party/rhwp`.
rhwp = { version = "0.8.7", default-features = false }
# Glyph lookup of the PDF fallback-font index (usvg keeps its own lookup private); already in the
# graph through usvg and svg2pdf.
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
# Synthetic bold and italic (PD-131) edit the page SVG at the byte positions of its elements; usvg
# parses with the same crate, so it is already in the graph.
roxmltree = "0.20"

# PD-103: update check over the OS TLS stack (no bundled TLS library).
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
# Opens the release page in the OS default browser (the URL is always Rust's own value).
open = "5"
# Signed in-app update (PD-103): download, minisign verification and install run in Rust only; the
# plugin is registered but its JS commands are never granted to a window. OS TLS like the check above
# (no bundled rustls); the `zip` feature (legacy zip updater packages) is not needed.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }
# `Abortable` ends a download that grows past the size limit.
futures-util = { version = "0.3", default-features = false }

# PD-170: the PDF worker process is measured and limited per OS (resident memory on macOS, an address
# space limit on Linux, a job object on Windows); both crates are already in the graph through tauri.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

# macOS recent items (PD-099): already in the dependency graph through tauri, here with only the
# two features the shell calls.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSDocumentController"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSURL", "NSArray", "NSDictionary", "NSString", "NSUserDefaults"] }
objc2 = "0.6"

# The Linux runtime fixes (PD-125) read GTK cache files in their tests.
[dev-dependencies]
tempfile = "3"
# Tests read the compressed content streams of the exported PDF (PD-131); already in the graph
# through svg2pdf.
miniz_oxide = "0.8"
